# Weekly: new decisions from the court's website, AI coding of new opinions, dashboard data rebuilt.
# See scripts/update.py. If it fails, GitHub emails the repository owner.
name: Weekly update
on:
  schedule:
    - cron: "23 7 * * 6"   # Saturdays 07:23 UTC (2:23 a.m. Eastern), after the week's postings
  workflow_dispatch:        # "Run workflow" button on the Actions tab
permissions:
  contents: write
concurrency:
  group: data-update        # never runs at the same time as the daily calendar job
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -q anthropic==2.8.0
      - name: Update data
        env:
          FEDCIR_API_KEY: ${{ secrets.FEDCIR_API_KEY }}
        run: python3 scripts/update.py
      - name: Save to GitHub
        if: always()   # keep whatever worked (and the id of an unfinished batch) even if a later step failed
        run: |
          git config user.name zljacobs24
          git config user.email zljacobs24@users.noreply.github.com
          git add data docs/data results samples
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Weekly update $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*15)); done
          exit 1
